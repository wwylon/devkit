<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRODUCT — short pitch</title>
  <meta name="description" content="Replace with one-sentence stranger-facing pitch.">
  <meta property="og:title" content="PRODUCT">
  <meta property="og:description" content="Replace with short OG description.">
  <meta property="og:image" content="https://OWNER.github.io/REPO/social.jpg">
  <meta property="og:url" content="https://OWNER.github.io/REPO/">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="canonical" href="https://OWNER.github.io/REPO/">
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef2;
      --muted: #9aa8b5;
      --accent: #2ec4b6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); max-width: 40rem; }
    .cta { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .cta a {
      color: var(--bg);
      background: var(--accent);
      text-decoration: none;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      font-weight: 600;
    }
    .cta a.secondary {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--muted);
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1><span>PRODUCT</span></h1>
    <p class="lead">One or two sentences: what it does and who it is for. Do not invent features.</p>
    <div class="cta">
      <a class="primary" href="https://github.com/OWNER/REPO#install">Install from GitHub</a>
      <a class="secondary" href="https://github.com/OWNER/REPO/blob/main/docs/">Documentation</a>
    </div>
    <footer>
      MIT · <a href="https://github.com/OWNER/REPO">github.com/OWNER/REPO</a>
      · Maintainer: Settings → Pages → Source = GitHub Actions
      (<code>pages.yml</code>). Social preview: upload <code>docs/assets/social.jpg</code>.
    </footer>
  </main>
</body>
</html>
